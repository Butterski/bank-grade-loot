<text x="24" y="205" xml:space="preserve" style="white-space:pre" textLength="714.0" lengthAdjust="spacing">  naive-in-transaction             240     238   <tspan fill="#ff7b72" font-weight="700">FAILS</tspan>  duplicate: 2 x Sword 17 (238)</text>
