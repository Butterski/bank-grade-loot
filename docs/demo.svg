<text x="24" y="100" xml:space="preserve" style="white-space:pre" textLength="243.6" lengthAdjust="spacing"><tspan fill="#f0f6fc" font-weight="700">Check 01 - Two buyers compete</tspan></text>
<text x="24" y="121" xml:space="preserve" style="white-space:pre" textLength="714.0" lengthAdjust="spacing"><tspan fill="#8b949e">  Stan and Kenny buy Sword 17 at the same moment. Every ordering of their statements.</tspan></text>
